<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QR Card</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    #qr-display {
      display: none;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #fff;
    }

    #setup {
      text-align: center;
      color: #fff;
      padding: 2rem;
    }

    #setup p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      opacity: 0.7;
    }

    #pick-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #fff;
      color: #000;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }

    #error {
      display: none;
      margin-top: 1.5rem;
      color: #ff8080;
      font-size: 1rem;
    }

    #reset-btn {
      display: none;
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #file-input { display: none; }
  </style>
</head>
<body>

  <img id="qr-display" alt="QR Code">

  <div id="setup">
    <p>Tap to save your QR code screenshot.<br>It stays on your phone only.</p>
    <button id="pick-btn">Choose QR Screenshot</button>
    <p id="error"></p>
  </div>

  <button id="reset-btn">Change QR</button>
  <input type="file" id="file-input" accept="image/*">

  <script>
    const qrDisplay = document.getElementById('qr-display');
    const setup     = document.getElementById('setup');
    const pickBtn   = document.getElementById('pick-btn');
    const resetBtn  = document.getElementById('reset-btn');
    const fileInput = document.getElementById('file-input');
    const errorEl   = document.getElementById('error');

    // Cap the stored image so it always fits in localStorage (~5MB quota).
    // 1600px on the long edge keeps QR modules sharp enough to scan.
    const MAX_EDGE = 1600;
    const JPEG_QUALITY = 0.85;

    function showQR(src) {
      qrDisplay.src = src;
      qrDisplay.style.display = 'block';
      setup.style.display = 'none';
      resetBtn.style.display = 'block';
    }

    function showSetup() {
      qrDisplay.removeAttribute('src');
      qrDisplay.style.display = 'none';
      setup.style.display = 'block';
      resetBtn.style.display = 'none';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function hideError() {
      errorEl.textContent = '';
      errorEl.style.display = 'none';
    }

    function readBlobAsDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function saveImage(file) {
      if (!file || !file.type.startsWith('image/')) {
        showError('That file is not an image.');
        return;
      }
      try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
        const w = Math.max(1, Math.round(bitmap.width * scale));
        const h = Math.max(1, Math.round(bitmap.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
        bitmap.close();

        const jpeg = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', JPEG_QUALITY));
        if (!jpeg) throw new Error('encode failed');

        const dataUrl = await readBlobAsDataURL(jpeg);
        localStorage.setItem('qr_image', dataUrl);
        hideError();
        fileInput.value = '';
        showQR(dataUrl);
      } catch (err) {
        const msg = err && err.name === 'QuotaExceededError'
          ? 'Image too large to save on this phone. Try a smaller screenshot.'
          : 'Could not save that image. Please try another file.';
        showError(msg);
      }
    }

    // Load saved QR on launch
    try {
      const saved = localStorage.getItem('qr_image');
      if (saved) showQR(saved);
    } catch (err) {
      showError('Saved image could not be read.');
    }

    pickBtn.addEventListener('click', () => fileInput.click());
    resetBtn.addEventListener('click', () => {
      try { localStorage.removeItem('qr_image'); } catch (err) { /* storage unavailable */ }
      hideError();
      showSetup();
    });

    fileInput.addEventListener('change', () => {
      saveImage(fileInput.files[0]);
    });

    // Register service worker (offline support)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline still works after first install */ });
    }
  </script>

</body>
</html>
